{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block public %}
<div class="card login">
  <h1>로그인</h1>
  <p class="sub">매장 계정으로 로그인해 주세요.</p>
  <form method="post">
    <div class="field">
      <label class="req" for="login_id">아이디</label>
      <input id="login_id" name="login_id" value="{{ login_id or '' }}" placeholder="아이디를 입력하세요"
             autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label class="req" for="password">비밀번호</label>
      <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요"
             autocomplete="current-password">
    </div>
    <div style="margin-top:24px">{% include "_flash.html" %}</div>
    <button class="btn primary block" type="submit" style="height:44px;margin-top:0">로그인</button>
  </form>
  <p class="muted" style="margin:24px 0 0">계정 이용 문의는 매장 점주에게 요청해 주세요.</p>
</div>
<p class="login-foot">매장 내부망 전용</p>
{% endblock %}
